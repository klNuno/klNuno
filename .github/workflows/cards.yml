name: cards

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Fetches the three cards with the "encre" palette and commits them.
# The generators only expose custom colours through their hosted URL, never
# through their Action, so the URL is called here once a day instead of being
# called by every visitor's browser. curl runs with -f, so a failing service
# leaves the previous card in place rather than overwriting it with an error page.

env:
  PALETTE: "bg_color=0b0d12&border_color=1c2130&title_color=a78bfa&text_color=c3c9d6&icon_color=7c5cff&chart_color=7c5cff"
  STREAK_PALETTE: "background=0b0d12&border=1c2130&stroke=1c2130&ring=a78bfa&fire=a78bfa&currStreakNum=e7e9f0&sideNums=c3c9d6&currStreakLabel=a78bfa&sideLabels=8b93a7&dates=6b7488"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: fetch cards
        run: |
          mkdir -p cards
          # Both generators answer HTTP 200 with a card that reads "ERROR!!!
          # Cards are temporarily rate limited." instead of a 4xx, so the status
          # code proves nothing. The body has to be inspected, and a bad answer
          # must leave the copy already in the repo alone.
          #
          # Denying known error strings is not enough: streak-stats draws a full
          # sized card with a sad face and "Failed to retrieve contributions"
          # when the GitHub API fails under it, which passes both the size and
          # the "ERROR!!!" test. Each card therefore has to prove it carries the
          # text it only ever carries when the data is real.
          fetch() {
            dest=$1; url=$2; marker=$3
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --max-time 30 -o /tmp/card.svg "$url" \
                 && [ "$(stat -c%s /tmp/card.svg)" -ge 2000 ] \
                 && grep -qF "$marker" /tmp/card.svg \
                 && ! grep -q 'ERROR!!!' /tmp/card.svg; then
                mv /tmp/card.svg "$dest"
                echo "$dest ok on attempt $attempt"
                return 0
              fi
              echo "$dest: attempt $attempt rejected"
              sleep 30
            done
            echo "$dest: giving up, keeping the copy already committed"
            # Only a genuine failure if there is nothing to fall back on.
            test -s "$dest"
          }

          base="https://github-profile-summary-cards.vercel.app/api/cards"
          fetch cards/profile.svg \
            "$base/profile-details?username=${{ github.repository_owner }}&$PALETTE" \
            "Public Repos"
          sleep 10
          fetch cards/productive-time.svg \
            "$base/productive-time?username=${{ github.repository_owner }}&utcOffset=2&$PALETTE" \
            "per day hour"
          sleep 10
          # disable_animations is not cosmetic here. This card starts every
          # element at opacity 0 and reveals it with a CSS fade, and CSS
          # animations do not run inside an svg embedded in another svg, so the
          # animated version renders as an empty rectangle.
          fetch cards/streak.svg \
            "https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&disable_animations=true&$STREAK_PALETTE" \
            "Total Contributions"

      - name: compose
        run: python3 scripts/compose.py

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --quiet --cached || git commit -m "chore: refresh cards"
          git push
