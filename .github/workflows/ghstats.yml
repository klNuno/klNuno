name: ghstats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # writes ghstats/<theme>/*.svg (16 cards) and commits them
      - uses: tiennm99/ghstats@v1
        with:
          user: ${{ github.repository_owner }}
          out: ghstats
          themes: dracula
          tz: Europe/Paris
          start_of_week: monday
          commit_changes: "true"
